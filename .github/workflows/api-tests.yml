name: API Tests

on:
  push:
  pull_request:

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Start application with Docker
        run: docker compose up --build -d

      - name: Show Docker containers
        run: docker compose ps

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/docs > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API... attempt $attempt/30"
            sleep 5
          done

          echo "API did not start"
          docker compose logs
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Newman
        run: npm install --global newman

      - name: Create results folder
        run: mkdir -p test-results

      - name: Run Postman tests
        run: |
          newman run "Tests/Postman/Stock-Tracker-API.postman_collection.json" \
            --reporters cli,json \
            --reporter-json-export test-results/newman-results.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: test-results/newman-results.json
          if-no-files-found: warn

      - name: Show Docker logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker containers
        if: always()
        run: docker compose down
services:
  ui-service:
    build:
      context: .
      dockerfile: ui_service/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ui_service/backend/.env
    volumes:
      - ./common:/app/common
    environment:
      - PYTHONPATH=/app/common:/app/backend
      - STOCK_MANAGER_URL=http://stock-manager:8001
      - NEWS_AGENT_URL=http://news-agent:8003
    depends_on:
      - stock-manager
      - news-agent
    restart: unless-stopped

  stock-manager:
    build:
      context: .
      dockerfile: stock_manager/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./stock_manager/backend/.env
    volumes:
      - ./common:/app/common
    environment:
      - PYTHONPATH=/app/common:/app/backend
    restart: unless-stopped

  llm-service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./llm_service/backend/.env
    volumes:
      - ./common:/app/common
    environment:
      - PYTHONPATH=/app/common:/app/backend
    restart: unless-stopped

  news-agent:
    build:
      context: .
      dockerfile: news_agent/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./news_agent/backend/.env
    volumes:
      - ./common:/app/common
    environment:
      - PYTHONPATH=/app/common:/app/backend
      - STOCK_MANAGER_URL=http://stock-manager:8001
    depends_on:
      - stock-manager
    restart: unless-stopped

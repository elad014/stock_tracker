services:
  ui-service:
    build:
      context: .
      dockerfile: ui_service/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ui_service/backend/.env
    volumes:
      - ./common:/app/common
    environment:
      - PYTHONPATH=/app/common:/app/backend
      - STOCK_SERVICE_URL=http://stock-service:8001
      - NEWS_SERVICE_URL=http://news-service:8003
      - DOC_SERVICE_URL=http://doc-service:8004
      - CHAT_SERVICE_URL=http://chat-service:8002
    depends_on:
      - stock-service
      - news-service
      - doc-service
      - chat-service
    restart: unless-stopped

  stock-service:
    build:
      context: .
      dockerfile: stock_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./stock_service/backend/.env
    volumes:
      - ./common:/app/common
    environment:
      - PYTHONPATH=/app/common:/app/backend
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: chat_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./chat_service/backend/.env
    volumes:
      - ./common:/app/common
      - ./chat_service/backend:/app/backend
    environment:
      - PYTHONPATH=/app/common:/app/backend
      - STOCK_SERVICE_URL=http://stock-service:8001
      - NEWS_SERVICE_URL=http://news-service:8003
      - DOC_SERVICE_URL=http://doc-service:8004
    depends_on:
      - stock-service
      - news-service
      - doc-service
    restart: unless-stopped

  news-service:
    build:
      context: .
      dockerfile: news_service/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./news_service/backend/.env
    volumes:
      - ./common:/app/common
      - ./news_service/backend:/app/backend
    environment:
      - PYTHONPATH=/app/common:/app/backend
      - STOCK_SERVICE_URL=http://stock-service:8001
    depends_on:
      - stock-service
    restart: unless-stopped

  doc-service:
    build:
      context: .
      dockerfile: doc_service/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - ./doc_service/backend/.env
    volumes:
      - ./common:/app/common
      - ./doc_service/backend:/app/backend
    environment:
      - PYTHONPATH=/app/common:/app/backend
    restart: unless-stopped
